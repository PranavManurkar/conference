<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password reset</title>
  </head>
  <body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;color:#1a1a1f;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:#f6f7fb;padding:24px;">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="background:#ffffff;border-radius:12px;border:1px solid #e6e8ef;overflow:hidden;">
            <tr>
              <td style="padding:24px 28px;">
                <h2 style="margin:0 0 12px 0;font-size:20px;">Reset your password</h2>
                <p style="margin:0 0 12px 0;line-height:1.5;">
                  We received a request to reset the password for your 2DMTG Conference account.
                </p>
                <p style="margin:0 0 16px 0;line-height:1.5;">
                  Use the button below to choose a new password.
                </p>
                <p style="margin:0 0 20px 0;">
                  <a href="{{ reset_url_base }}?uid={{ uid }}&token={{ token }}" style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:600;">
                    Reset password
                  </a>
                </p>
                <p style="margin:0 0 12px 0;font-size:14px;color:#4b5563;line-height:1.5;">
                  If you did not request this, you can ignore this email.
                </p>
                <p style="margin:0;font-size:14px;color:#4b5563;line-height:1.5;">
                  Need help? Contact us at {{ support_email }}.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
